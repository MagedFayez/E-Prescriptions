name: Build and Test e_prescriptions

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: msbuild e_prescriptions.sln /t:Restore

      - name: Build Whole Solution
        run: msbuild e_prescriptions.sln /p:Configuration=Release /p:Platform="Any CPU" /m /v:m

      - name: Verify SQLite Interop Native Binaries
        shell: pwsh
        run: |
          $appBin = "src\ePrescriptions.App\bin\Release\net48"
          $testsBin = "tests\ePrescriptions.Tests\bin\Release\net48"
          $nugetRoot = "$env:USERPROFILE\.nuget\packages\stub.system.data.sqlite.core.netframework"
          if (Test-Path $nugetRoot) {
              $ver = (Get-ChildItem -Directory -Path $nugetRoot | Sort-Object Name -Descending | Select-Object -First 1).FullName
              $x86Source = Join-Path $ver "build\net48\x86\SQLite.Interop.dll"
              $x64Source = Join-Path $ver "build\net48\x64\SQLite.Interop.dll"
              if ((Test-Path $x86Source) -and (-not (Test-Path "$appBin\x86\SQLite.Interop.dll"))) {
                  New-Item -ItemType Directory -Path "$appBin\x86" -Force | Out-Null
                  Copy-Item -Path $x86Source -Destination "$appBin\x86\SQLite.Interop.dll" -Force
              }
              if ((Test-Path $x64Source) -and (-not (Test-Path "$appBin\x64\SQLite.Interop.dll"))) {
                  New-Item -ItemType Directory -Path "$appBin\x64" -Force | Out-Null
                  Copy-Item -Path $x64Source -Destination "$appBin\x64\SQLite.Interop.dll" -Force
              }
              if ((Test-Path $x86Source) -and (-not (Test-Path "$testsBin\x86\SQLite.Interop.dll"))) {
                  New-Item -ItemType Directory -Path "$testsBin\x86" -Force | Out-Null
                  Copy-Item -Path $x86Source -Destination "$testsBin\x86\SQLite.Interop.dll" -Force
              }
              if ((Test-Path $x64Source) -and (-not (Test-Path "$testsBin\x64\SQLite.Interop.dll"))) {
                  New-Item -ItemType Directory -Path "$testsBin\x64" -Force | Out-Null
                  Copy-Item -Path $x64Source -Destination "$testsBin\x64\SQLite.Interop.dll" -Force
              }
          }
          if (-not (Test-Path "$appBin\x86\SQLite.Interop.dll")) {
              throw "Missing SQLite.Interop.dll in $appBin\x86"
          }
          if (-not (Test-Path "$appBin\x64\SQLite.Interop.dll")) {
              throw "Missing SQLite.Interop.dll in $appBin\x64"
          }

      - name: Run Tests with dotnet test
        run: dotnet test tests/ePrescriptions.Tests/ePrescriptions.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test_results.trx" --results-directory ./TestResults

      - name: Verify Test Counters and Guard Results
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Path "./TestResults" -Filter "*.trx" -Recurse
          if ($trxFiles.Count -eq 0) {
              throw "Test results trx file not found."
          }
          [xml]$trx = Get-Content -Path $trxFiles[0].FullName
          $counters = $trx.TestRun.ResultSummary.Counters
          $executed = [int]$counters.executed
          $failed = [int]$counters.failed
          Write-Host "Tests Executed: $executed, Failed: $failed"
          if ($executed -eq 0) {
              throw "No tests were executed. Test runner executed count is 0."
          }
          if ($failed -gt 0) {
              throw "$failed test(s) failed."
          }

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/*.trx
          if-no-files-found: ignore

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Compile Installer with Inno Setup
        shell: cmd
        run: |
          mkdir dist\installer 2>nul
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\e_prescriptions_installer.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: e_prescriptions_Setup_v1.0.0
          path: dist/installer/e_prescriptions_Setup_v1.0.0.exe
          if-no-files-found: error
